<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Geometry Dash New</title>
<style>
  body {
    margin: 0;
    background: #050812;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  h1 {
    margin: 0 0 10px 0;
    font-size: 20px;
    letter-spacing: 1px;
    color: #00eaff;
  }
  #game {
    border: 2px solid #101528;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    background: #071026;
  }
  #ui {
    margin-top: 10px;
    font-size: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>GEOMETRY DASH NEW</h1>
<canvas id="game" width="1000" height="500"></canvas>
<div id="ui">Score : 0</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const GROUND_Y = H - 100;
const CEILING_Y = 60;
const PLAYER_SIZE = 35;
const BASE_SPEED = 8; // Vitesse augmentée (vitesse limace éliminée !)

const player = {
  x: 150,
  y: GROUND_Y,
  size: PLAYER_SIZE,
  vy: 0,
  onGround: false,
  angle: 0
};

let gravity = 0.9;
let gravitySign = 1;
let speed = BASE_SPEED;
let score = 0;

let blocks = [];
let spikes = [];
let portals = [];
let particles = [];

let gameOver = false;
let deathTimer = 0;
let lastObstacleX = -9999;
let animationId = null;

function jump() {
  if (!gameOver && player.onGround) {
    player.vy = -16.5 * gravitySign;
    player.onGround = false;
  } else if (gameOver && deathTimer <= 0) {
    restart();
  }
}

window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener("click", jump);

function spawnObstacle() {
  // Distance minimale réduite pour rapprocher les obstacles
  if (W + 50 - lastObstacleX < 180) return;

  const rand = Math.random();
  const baseY = (gravitySign === 1) ? GROUND_Y : CEILING_Y;

  if (rand < 0.45) {
    // Bloc
    let w = 60 + Math.random() * 30;
    let h = 40 + Math.random() * 35;
    let y = (gravitySign === 1) ? baseY - h : baseY;
    blocks.push({ x: W + 50, y, w, h });
  } else if (rand < 0.9) {
    // Pic
    let size = 35;
    let y = (gravitySign === 1) ? baseY - size : baseY;
    spikes.push({ x: W + 50, y, size });
  } else {
    // Portail
    let y = (gravitySign === 1) ? GROUND_Y - 120 : CEILING_Y;
    portals.push({ x: W + 50, y, w: 30, h: 90, used: false });
  }
  lastObstacleX = W + 50;
}

function triggerDeath() {
  if (gameOver) return;
  gameOver = true;
  deathTimer = 60;
  particles = [];
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: player.x + player.size/2,
      y: player.y + player.size/2,
      vx: (Math.random()*2-1)*7,
      vy: (Math.random()*2-1)*7,
      life: 40 + Math.random()*20
    });
  }
}

function restart() {
  if (animationId) cancelAnimationFrame(animationId);
  blocks = [];
  spikes = [];
  portals = [];
  particles = [];
  score = 0;
  speed = BASE_SPEED;
  gravitySign = 1;
  player.x = 150;
  player.y = GROUND_Y;
  player.vy = 0;
  player.onGround = false;
  player.angle = 0;
  gameOver = false;
  deathTimer = 0;
  lastObstacleX = -9999;
  loop();
}

let bgOffset = 0;
function loop() {
  ctx.clearRect(0, 0, W, H);

  // Background
  bgOffset -= speed * 0.2;
  ctx.fillStyle = "#050812";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#0d1326";
  for (let i = 0; i < 15; i++) {
    let x = (i * 250 + bgOffset) % (W + 250) - 250;
    ctx.fillRect(x, H - 180, 180, 180);
  }

  if (!gameOver) {
    // Augmentation progressive de la vitesse avec le score
    speed = BASE_SPEED + Math.floor(score / 50) * 0.5;

    player.vy += gravity * gravitySign;
    player.y += player.vy;
    player.onGround = false;

    if (gravitySign === 1 && player.y > GROUND_Y - player.size) {
      player.y = GROUND_Y - player.size;
      player.vy = 0;
      player.onGround = true;
    } else if (gravitySign === -1 && player.y < CEILING_Y) {
      player.y = CEILING_Y;
      player.vy = 0;
      player.onGround = true;
    }

    if (!player.onGround) {
      player.angle += 0.3 * gravitySign;
    } else {
      player.angle = Math.round(player.angle / (Math.PI / 2)) * (Math.PI / 2);
    }

    // Fréquence de spawn beaucoup plus agressive
    if (Math.random() < 0.05) spawnObstacle();

    // Blocs
    blocks.forEach(b => {
      b.x -= speed;
      ctx.fillStyle = "#ff3c7d";
      ctx.fillRect(b.x, b.y, b.w, b.h);

      if (player.x < b.x + b.w && player.x + player.size > b.x && player.y < b.y + b.h && player.y + player.size > b.y) {
        const topOverlap = (player.y + player.size) - b.y;
        if (topOverlap <= 15 && player.vy * gravitySign >= 0) {
          player.y = b.y - player.size;
          player.vy = 0;
          player.onGround = true;
        } else {
          triggerDeath();
        }
      }
    });
    blocks = blocks.filter(b => b.x + b.w > 0);

    // Pics
    spikes.forEach(s => {
      s.x -= speed;
      ctx.fillStyle = "#ffdd55";
      ctx.beginPath();
      if (gravitySign === 1) {
        ctx.moveTo(s.x, s.y + s.size);
        ctx.lineTo(s.x + s.size/2, s.y);
        ctx.lineTo(s.x + s.size, s.y + s.size);
      } else {
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + s.size/2, s.y + s.size);
        ctx.lineTo(s.x + s.size, s.y);
      }
      ctx.closePath();
      ctx.fill();

      if (player.x < s.x + s.size - 8 && player.x + player.size > s.x + 8 && player.y < s.y + s.size && player.y + player.size > s.y + 8) {
        triggerDeath();
      }
    });
    spikes = spikes.filter(s => s.x + s.size > 0);

    // Portails
    portals.forEach(p => {
      p.x -= speed;
      ctx.strokeStyle = "#7b5cff";
      ctx.lineWidth = 4;
      ctx.strokeRect(p.x, p.y, p.w, p.h);

      if (!p.used && player.x < p.x + p.w && player.x + player.size > p.x && player.y < p.y + p.h && player.y + player.size > p.y) {
        p.used = true;
        gravitySign *= -1;
        player.vy = 0;
      }
    });
    portals = portals.filter(p => p.x + p.w > 0);

    score += 0.2;
  }

  // Écran de mort
  if (gameOver) {
    deathTimer--;
    particles.forEach(pt => {
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.2;
      pt.life--;
      ctx.fillStyle = "#00eaff";
      ctx.fillRect(pt.x, pt.y, 5, 5);
    });
    particles = particles.filter(pt => pt.life > 0);

    ctx.fillStyle = "rgba(5,8,18,0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.font = "28px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Mort ! Clique ou appuie sur Espace", W/2, H/2);
  }

  // Joueur triangle
  if (!gameOver) {
    ctx.save();
    ctx.translate(player.x + player.size/2, player.y + player.size/2);
    ctx.rotate(player.angle);
    ctx.translate(-player.size/2, -player.size/2);

    ctx.fillStyle = "#00eaff";
    ctx.beginPath();
    if (gravitySign === 1) {
      ctx.moveTo(0, 0);
      ctx.lineTo(0, player.size);
      ctx.lineTo(player.size, player.size/2);
    } else {
      ctx.moveTo(0, player.size);
      ctx.lineTo(0, 0);
      ctx.lineTo(player.size, player.size/2);
    }
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  document.getElementById("ui").textContent = "Score : " + Math.floor(score);
  animationId = requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
